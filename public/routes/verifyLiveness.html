<!doctype html>
<html>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background: url("owl_beige.png") center center no-repeat;
    background-size: cover;
    background-attachment: fixed;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  /* ── Hero Logo Section ── */
  .nova-hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 36px auto 0;
    gap: 0;
  }

  .nova-logo-wrapper {
    position: relative;
    width: 110px;
    height: 110px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Animated glow ring */
  .nova-logo-wrapper::before {
    content: '';
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, #534AB7, #9B93E8, #3ECFCF, #534AB7);
    animation: spin-ring 3s linear infinite;
    z-index: 0;
  }

  /* White backing disc */
  .nova-logo-wrapper::after {
    content: '';
    position: absolute;
    inset: 3px;
    border-radius: 50%;
    background: #fff;
    z-index: 1;
  }

  .nova-logo-img {
    position: relative;
    z-index: 2;
    width: 92px;
    height: 92px;
    border-radius: 50%;
    object-fit: cover;
    filter: drop-shadow(0 4px 16px rgba(83,74,183,0.30));
  }

  @keyframes spin-ring {
    to { transform: rotate(360deg); }
  }

  .nova-brand-name {
    margin-top: 14px;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 0.04em;
    background: linear-gradient(135deg, #3C3489 0%, #534AB7 50%, #7F77DD 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: none;
  }

  .nova-tagline {
    margin-top: 4px;
    font-size: 12px;
    font-weight: 600;
    color: #8B86C8;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  /* ── "Thank You" pill ── */
  .nova-message {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 20px auto 0;
    padding: 8px 22px;
    background: rgba(255,255,255,0.88);
    border-radius: 40px;
    border: 0.5px solid rgba(83,74,183,0.25);
    font-size: 13px;
    font-weight: 700;
    color: #534AB7;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    backdrop-filter: blur(6px);
    box-shadow: 0 2px 12px rgba(83,74,183,0.10);
  }

  .nova-message .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #3ECFCF;
    box-shadow: 0 0 0 3px rgba(62,207,207,0.25);
    animation: pulse-dot 1.8s ease-in-out infinite;
  }

  @keyframes pulse-dot {
    0%, 100% { box-shadow: 0 0 0 3px rgba(62,207,207,0.25); }
    50%       { box-shadow: 0 0 0 6px rgba(62,207,207,0.10); }
  }

  /* ── Main Card ── */
  .container {
    width: 100%;
    max-width: 460px;
    margin: 24px auto 0;
    padding: 0 16px;
  }

  .input-container,
  div[style*="background-color: rgb(249, 249, 249)"],
  div[style*="background-color:rgb(249,249,249)"] {
    background: rgba(255,255,255,0.97) !important;
    border: 0.5px solid rgba(83,74,183,0.18) !important;
    border-radius: 20px !important;
    box-shadow: 0 4px 32px rgba(83,74,183,0.13), 0 1px 4px rgba(83,74,183,0.07) !important;
    padding: 0 !important;
    overflow: hidden !important;
    max-width: 100% !important;
    width: 100% !important;
  }

  .input-container::before,
  div[style*="background-color: rgb(249, 249, 249)"]::before {
    content: '';
    display: block;
    height: 5px;
    background: linear-gradient(90deg, #534AB7, #7F77DD, #3ECFCF, #7F77DD, #534AB7);
    background-size: 200% 100%;
    border-radius: 20px 20px 0 0;
    animation: shimmer-bar 4s linear infinite;
  }

  @keyframes shimmer-bar {
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  .input-container > *,
  div[style*="background-color: rgb(249, 249, 249)"] > * {
    padding-left: 28px !important;
    padding-right: 28px !important;
  }

  #srn {
    font-size: 11px !important;
    font-weight: 800 !important;
    color: #534AB7 !important;
    letter-spacing: 0.10em !important;
    text-transform: uppercase !important;
    margin: 22px 0 6px !important;
    padding: 0 28px !important;
  }

  #applicationId {
    width: 100% !important;
    padding: 12px 14px !important;
    font-size: 15px !important;
    font-family: 'SFMono-Regular', Consolas, monospace !important;
    letter-spacing: 0.08em !important;
    text-transform: uppercase !important;
    background: #F5F4FF !important;
    border: 1.5px solid #CECBF6 !important;
    border-radius: 12px !important;
    color: #26215C !important;
    outline: none !important;
    margin-bottom: 22px !important;
    transition: border-color 0.18s, box-shadow 0.18s, background 0.18s !important;
  }

  #applicationId:focus {
    border-color: #7F77DD !important;
    box-shadow: 0 0 0 3px rgba(127,119,221,0.18) !important;
    background: #fff !important;
  }

  #applicationId::placeholder {
    color: #C4C0EE !important;
    letter-spacing: 0.04em !important;
    font-weight: 400 !important;
  }

  #verifySelfie {
    padding: 11px 26px !important;
    font-size: 14px !important;
    font-weight: 700 !important;
    font-family: 'Nunito', sans-serif !important;
    background: linear-gradient(135deg, #534AB7 0%, #7F77DD 100%) !important;
    color: #fff !important;
    border: none !important;
    border-radius: 12px !important;
    cursor: pointer !important;
    box-shadow: 0 3px 14px rgba(83,74,183,0.35) !important;
    transition: transform 0.15s, box-shadow 0.15s !important;
    margin-right: 10px !important;
    margin-bottom: 26px !important;
    letter-spacing: 0.02em !important;
  }

  #verifySelfie:hover {
    transform: translateY(-2px) !important;
    box-shadow: 0 6px 20px rgba(83,74,183,0.40) !important;
  }

  #verifySelfie:active {
    transform: scale(0.97) !important;
    box-shadow: 0 2px 8px rgba(83,74,183,0.30) !important;
  }

  #verifySelfie:disabled {
    background: linear-gradient(135deg, #AFA9EC 0%, #C8C4F4 100%) !important;
    cursor: not-allowed !important;
    box-shadow: none !important;
    transform: none !important;
  }

  #RESET {
    padding: 11px 22px !important;
    font-size: 13px !important;
    font-weight: 600 !important;
    font-family: 'Nunito', sans-serif !important;
    background: transparent !important;
    color: #9996B8 !important;
    border: 1.5px solid #E0DEF5 !important;
    border-radius: 12px !important;
    cursor: pointer !important;
    transition: background 0.15s, color 0.15s, border-color 0.15s !important;
    margin-bottom: 26px !important;
    letter-spacing: 0.02em !important;
  }

  #RESET:hover {
    background: #F5F4FF !important;
    color: #534AB7 !important;
    border-color: #C4C0EE !important;
  }

  /* Fade-in animation for whole page */
  .nova-hero, .nova-message, .container {
    animation: fadeUp 0.5s ease both;
  }
  .nova-hero    { animation-delay: 0s; }
  .nova-message { animation-delay: 0.12s; }
  .container    { animation-delay: 0.22s; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
