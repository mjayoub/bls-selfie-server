<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BLS Auto Selfie — Vérification Client</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top center, #1e1b4b 0%, #0f172a 60%, #020617 100%);
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 24px 16px;
    }

    /* ── Hero Shield Badge ── */
    .hero-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 24px;
      animation: fadeInDown 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .hero-shield-wrapper {
      position: relative;
      width: 96px;
      height: 96px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    .hero-shield-wrapper::before {
      content: '';
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #6366f1, #22c55e, #38bdf8, #6366f1);
      animation: spinRing 4s linear infinite;
      z-index: 0;
      opacity: 0.85;
      filter: blur(4px);
    }

    .hero-shield-inner {
      position: relative;
      z-index: 1;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: #0f172a;
      border: 2px solid rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(99, 102, 241, 0.35);
    }

    .hero-shield-icon {
      width: 44px;
      height: 44px;
      color: #38bdf8;
      filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.6));
    }

    @keyframes spinRing {
      to { transform: rotate(360deg); }
    }

    .brand-title {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 0.05em;
      background: linear-gradient(135deg, #ffffff 0%, #a5f3fc 50%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-transform: uppercase;
      margin: 0;
    }

    .brand-subtitle {
      font-size: 13px;
      font-weight: 600;
      color: #94a3b8;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-top: 6px;
    }

    /* ── Live Indicator Badge ── */
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 28px;
      padding: 8px 20px;
      background: rgba(30, 41, 59, 0.8);
      border-radius: 40px;
      border: 1px solid rgba(56, 189, 248, 0.25);
      font-size: 12px;
      font-weight: 700;
      color: #38bdf8;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }

    .status-pill .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.3);
      animation: pulseDot 1.8s ease-in-out infinite;
    }

    @keyframes pulseDot {
      0%, 100% { box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.3); }
      50%       { box-shadow: 0 0 0 7px rgba(34, 197, 94, 0.1); }
    }

    /* ── Glassmorphic Main Card ── */
    .main-card {
      width: 100%;
      max-width: 480px;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 32px 24px;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.05);
      animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.15s both;
    }

    .pin-header-label {
      font-size: 12px;
      font-weight: 800;
      color: #cbd5e1;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 20px;
    }

    /* ── 6 Carreaux (6-Digit PIN Boxes) ── */
    .pin-grid {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 24px;
    }

    .pin-box {
      width: 54px;
      height: 64px;
      font-size: 26px;
      font-weight: 800;
      text-align: center;
      color: #38bdf8;
      background: rgba(15, 23, 42, 0.8);
      border: 2px solid rgba(99, 102, 241, 0.3);
      border-radius: 14px;
      outline: none;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
    }

    .pin-box:focus {
      border-color: #38bdf8;
      background: rgba(30, 41, 59, 0.9);
      box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.25), inset 0 2px 4px rgba(0, 0, 0, 0.2);
      transform: translateY(-2px);
    }

    .pin-box.filled {
      border-color: #22c55e;
      color: #4ade80;
      background: rgba(20, 83, 45, 0.25);
    }

    /* ── Status Message Container ── */
    #status-container {
      text-align: center;
      min-height: 24px;
      margin-bottom: 20px;
    }

    #srn {
      font-size: 14px;
      font-weight: 700;
      margin: 0;
    }

    /* ── Buttons ── */
    .actions-row {
      display: flex;
      gap: 12px;
    }

    .btn-verify {
      flex: 1;
      padding: 14px 20px;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: #ffffff;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 50%, #0284c7 100%);
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
      transition: all 0.2s ease;
      text-transform: uppercase;
    }

    .btn-verify:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(99, 102, 241, 0.5);
    }

    .btn-verify:active {
      transform: translateY(0);
    }

    .btn-verify:disabled {
      background: linear-gradient(135deg, #475569 0%, #334155 100%);
      box-shadow: none;
      cursor: not-allowed;
      opacity: 0.6;
    }

    .btn-reset {
      padding: 14px 20px;
      font-size: 14px;
      font-weight: 700;
      color: #94a3b8;
      background: rgba(15, 23, 42, 0.6);
      border: 1.5px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-reset:hover {
      background: rgba(30, 41, 59, 0.9);
      color: #f1f5f9;
      border-color: rgba(255, 255, 255, 0.2);
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 440px) {
      .pin-box {
        width: 44px;
        height: 54px;
        font-size: 22px;
      }
    }
  </style>
</head>
<body>

  <!-- ── Hero Branding Section ── -->
  <div class="hero-container">
    <div class="hero-shield-wrapper">
      <div class="hero-shield-inner">
        <svg class="hero-shield-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <circle cx="12" cy="11" r="3"/>
          <path d="M12 17v-3"/>
        </svg>
      </div>
    </div>
    <h1 class="brand-title">BLS AUTO SELFIE</h1>
    <div class="brand-subtitle">Vérification d'Identité Client</div>
  </div>

  <!-- ── Status Pill ── -->
  <div class="status-pill">
    <span class="dot"></span>
    Système de Vérification Sécurisé En Ligne
  </div>

  <!-- ── Main Glassmorphic Card ── -->
  <div class="main-card">
    <div class="pin-header-label">ENTREZ LE CODE À 6 CHIFFRES DE VOTRE BOT</div>
    
    <!-- ── 6 Carreaux Input ── -->
    <div class="pin-grid">
      <input type="text" maxlength="1" class="pin-box" id="pin-1" inputmode="numeric" pattern="[0-9]*" autocomplete="off" autofocus />
      <input type="text" maxlength="1" class="pin-box" id="pin-2" inputmode="numeric" pattern="[0-9]*" autocomplete="off" />
      <input type="text" maxlength="1" class="pin-box" id="pin-3" inputmode="numeric" pattern="[0-9]*" autocomplete="off" />
      <input type="text" maxlength="1" class="pin-box" id="pin-4" inputmode="numeric" pattern="[0-9]*" autocomplete="off" />
      <input type="text" maxlength="1" class="pin-box" id="pin-5" inputmode="numeric" pattern="[0-9]*" autocomplete="off" />
      <input type="text" maxlength="1" class="pin-box" id="pin-6" inputmode="numeric" pattern="[0-9]*" autocomplete="off" />
    </div>

    <!-- Hidden Input containing full combined value for vf.js compatibility -->
    <input type="hidden" id="applicationId" name="applicationId" />

    <div id="status-container">
      <p id="srn"></p>
    </div>

    <!-- ── Action Buttons ── -->
    <div class="actions-row">
      <button type="button" id="verifySelfie" class="btn-verify">Valider Selfie</button>
      <button type="button" id="RESET" class="btn-reset">Effacer</button>
    </div>
  </div>

  <!-- JavaScript Handler -->
  <script src="/js/vf.js" type="module"></script>
</body>
</html>
